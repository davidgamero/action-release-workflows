name: create release

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
        description: The branch to release
      version:
        required: true
        type: string
        description: The version of the release
      body:
        required: true
        type: string
        description: The body of the release
      prerelease:
        required: false
        default: false
        type: boolean
        description: Whether the release is a prerelease

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Normalize the branch input so callers may pass either a full ref
      # (e.g. refs/heads/main) or a short branch name (e.g. main). The
      # release action's `commit` input expects a branch name or commit
      # hash, not a fully-qualified ref, so strip any refs/heads/ or
      # refs/tags/ prefix. This keeps backwards compatibility with existing
      # callers that pass ${{ github.ref }}.
      - id: normalize
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          branch="${INPUT_BRANCH#refs/heads/}"
          branch="${branch#refs/tags/}"
          echo "commit=${branch}" >> "$GITHUB_OUTPUT"

      - uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          name: ${{ inputs.version }}
          tag: ${{ inputs.version }}
          body: ${{ inputs.body }}
          commit: ${{ steps.normalize.outputs.commit }}
          prerelease: ${{ inputs.prerelease == 'prereleased' }}
